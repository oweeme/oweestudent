app-id: app.oweestudent.OweeStudent
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: oweestudent
finish-args:
  - --share=ipc
  - --share=network        # sincronizar entre equipos y descargar la IA local
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
modules:
  # TODO: módulo `mpv` (libmpv.so.2) — Flet lo exige y el runtime no lo trae.
  - name: oweestudent
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/oweestudent /app/bin
      - cp -r OweeStudent-*-linux/app/. /app/lib/oweestudent/
      - install -Dm755 OweeStudent-*-linux/launcher.sh /app/bin/oweestudent
      - sed -i 's|/opt/oweestudent|/app/lib/oweestudent|' /app/bin/oweestudent
      - install -Dm644 app.oweestudent.OweeStudent.desktop /app/share/applications/app.oweestudent.OweeStudent.desktop
      - install -Dm644 app.oweestudent.OweeStudent.metainfo.xml /app/share/metainfo/app.oweestudent.OweeStudent.metainfo.xml
      - install -Dm644 OweeStudent-*-linux/oweestudent.png /app/share/icons/hicolor/256x256/apps/app.oweestudent.OweeStudent.png
    sources:
      - type: archive
        url: https://github.com/oweeme/oweestudent/releases/download/v0.15.0/OweeStudent-0.13.0-linux-x86_64.tar.gz
        sha256: REEMPLAZAR_CON_EL_SHA256_DE_LA_RELEASE
      - type: file
        path: app.oweestudent.OweeStudent.desktop
      - type: file
        path: app.oweestudent.OweeStudent.metainfo.xml
